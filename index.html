<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Radar de Convocatorias</title>

    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="header-content">
            <h1>Convocatorias</h1>
        </div>
    </header>


    <main>

        <!-- =====================================================
         Filtros
         ===================================================== -->

        <section class="filtros">
            <label>
                Institución
                <select id="filtro-institucion">
                    <option value="">Todas</option>
                </select>
            </label>

            <label>
                Categoría
                <select id="filtro-categoria">
                    <option value="">Todas</option>
                </select>
            </label>

            <label>
                Estado
                <select id="filtro-estado">
                    <option value="">Todos</option>
                </select>
            </label>
        </section>


        <!-- =====================================================
         Tabla
         ===================================================== -->

        <section class="tabla-container">
            <table>
                <thead>
                    <tr>
                        <th>Institución</th>
                        <th>Categoría</th>
                        <th>Nombre</th>
                        <th>Estado</th>
                        <th>Apertura</th>
                        <th>Cierre</th>
                        <th>Enlace</th>
                    </tr>
                </thead>
                <tbody id="contenedor-convocatorias">
                    <tr>
                        <td colspan="7" class="cargando">Cargando datos...</td>
                    </tr>
                </tbody>
            </table>
        </section>

    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="app.js?v=3"></script>
</body>

</html>
