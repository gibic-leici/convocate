<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar de Convocatorias</title>
    <!-- Pico.css para estilos semánticos y simples -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <!-- Barra superior permanente -->
        <nav class="barra-superior">
            <ul>
                <li><strong>Convocatorias</strong></li>
            </ul>
            <ul>
                <li>
                    <select id="filtro-institucion" aria-label="Filtrar por Institución">
                        <option value="">Institución: Todas</option>
                    </select>
                </li>
                <li>
                    <select id="filtro-categoria" aria-label="Filtrar por Categoría">
                        <option value="">Categoría: Todas</option>
                    </select>
                </li>
            </ul>
        </nav>

        <!-- Resultados -->
        <section id="contenedor-convocatorias" aria-busy="true">
            <!-- Las tarjetas se inyectan acá vía JS -->
        </section>
    </main>

    <!-- PapaParse para CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
