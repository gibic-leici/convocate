name: Scraper y Despliegue a GitHub Pages

on:
  schedule:
    # Se ejecuta automáticamente todos los lunes a las 08:00 UTC (05:00 AM hora Argentina)
    - cron: '0 8 * * 1'
  workflow_dispatch: # Permite disparar la ejecución manualmente desde GitHub

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Scraper
        run: |
          python scraper/scraper.py

      - name: Sincronizar sitio estático en la raíz
        run: |
          cp web/index.html index.html
          cp web/style.css style.css
          cp web/app.js app.js

      - name: Guardar cambios en el repositorio
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ index.html style.css app.js web/
          if ! git diff --staged --quiet; then
            git commit -m "auto: actualización de convocatorias"
            git pull --rebase -X theirs origin master
            git push origin master
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
